# Environment for part 09 (structural bioinformatics, introduction).
# Create once:   conda env create -f envs/structural.yml
# Then:          conda activate structural
# Versions used in the lessons (2026-10-24): gemmi 0.7.5, PyMOL (open-source) 3.1.0, RDKit 2026.03.1,
# Open Babel 3.2.1, AutoDock Vina 1.2.7, PDBFixer 1.12, OpenMM 8.6.1, mdtraj 1.11.1, matplotlib 3.11.2.
# Peak memory in the lessons: docking rifampicin with Vina ~1.3 GB; everything else < 0.5 GB.
# GROMACS (module 04) is only described; install it separately following its documentation.
# Not yet solved online: conda.anaconda.org was unreachable from the course server (2026-10-24).
name: structural
channels:
  - conda-forge
dependencies:
  - python>=3.11
  - gemmi>=0.7
  - pymol-open-source>=3.0
  - rdkit>=2024.03
  - openbabel>=3.1
  - vina>=1.2.5
  - pdbfixer>=1.9
  - openmm>=8.1
  - mdtraj>=1.10
  - matplotlib-base>=3.8
  - numpy
