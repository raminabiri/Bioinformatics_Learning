# Environment for part 13 (RNA-seq transcriptomics).
# Create once:   conda env create -f envs/rnaseq.yml
# Then:          conda activate rnaseq
# Command-line tools: FastQC and MultiQC (13/01), HISAT2, Salmon, kallisto, featureCounts (subread), samtools (13/02),
# Bowtie2 (13/05). R with DESeq2, edgeR, limma, apeglm and tximport (13/03-13/05). Python for the read simulator.
# STAR is only described (its human index needs ~32 GB RAM).
# The R analysis scripts of part 13 are plain R files, so they also run in R/RStudio on Windows
# (install the Bioconductor packages there with BiocManager::install()).
name: rnaseq
channels:
  - conda-forge
  - bioconda
dependencies:
  - python>=3.10
  - biopython
  - pandas
  - requests
  - numpy
  - fastqc
  - multiqc
  - hisat2
  - salmon
  - kallisto
  - subread
  - samtools>=1.20
  - bowtie2
  - r-base>=4.4
  - r-ggplot2
  - r-pheatmap
  - bioconductor-deseq2
  - bioconductor-edger
  - bioconductor-limma
  - bioconductor-apeglm
  - bioconductor-tximport
