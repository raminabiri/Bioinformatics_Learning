# Environment for part 06 (Metagenomics), modules 01-03.
# Create once:   conda env create -f envs/metagenomics.yml
# Then:          conda activate metagenomics
# Versions are the ones the lessons were run with (2026-10-12/13). Module 04 (16S) uses the
# official QIIME 2 environment instead (see 06_Metagenomics/04_16S_Amplicon).
# Not yet solved online: conda.anaconda.org was unreachable from the course server (2026-10-21).
name: metagenomics
channels:
  - conda-forge
  - bioconda
dependencies:
  # module 01: read QC
  - fastqc=0.12.1
  - fastp=0.23.4
  - multiqc=1.25.1
  # module 02: host removal
  - bowtie2=2.5.4
  - samtools=1.20
  - wgsim                       # read simulator for the spike-in control (module 02)
  # module 03: taxonomic profiling
  - kraken2=2.17.1
  - bracken=3.0.1
  - ncbi-datasets-cli=18.38.0
  # shared
  - seqkit=2.13.0
  - python                      # not pinned: snakemake-minimal 9.25.2 needs python_abi 3.14
  - snakemake-minimal=9.25.2
